<style>
    @keyframes drift-left {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(-2000px);
        }
    }
    
    .ambient-squiggle {
        animation: drift-left linear infinite;
    }
    
    .squiggle-slow {
        animation-duration: 5s;
    }
    
    .squiggle-slower {
        animation-duration: 10s;
    }
    
    .squiggle-slowest {
        animation-duration: 25s;
    }
</style>

<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Wave line 1: Slow, extreme swells -->
    <svg class="ambient-squiggle absolute" style="top: 8%; width: 4000px; height: 60px; animation-duration: 22s" viewBox="0 0 2000 60" preserveAspectRatio="none">
        <defs>
            <pattern id="wave1" x="0" y="0" width="2000" height="60" patternUnits="userSpaceOnUse">

                      stroke="#ffba00" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round"/>

        <rect width="4000" height="60" fill="url(#wave1)"/>
    </svg>
