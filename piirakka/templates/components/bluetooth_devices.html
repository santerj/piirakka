<ul class="list bg-base-100 rounded-box shadow-md w-180">
    {% for device in devices %}
        <li class="grid grid-cols-[1fr_110px_120px] items-center gap-2 px-4 py-3 border-b border-base-200 last:border-none" data-mac-address="{{ device.address }}">
            
            <div class="font-semibold truncate pr-4">{{ device.name }}</div>

            <div class="text-sm w-27.5">
                {% if device.paired %}
                    <span class="text-green-500 hover:underline" id="unpair" onclick="unpairBluetoothDevice(this)">
                        paired
                    </span>
                {% else %}
                    <span class="text-red-500 hover:underline" id="pair" onclick="pairBluetoothDevice(this)">
                        not paired
                    </span>
                {% endif %}
            </div>

            <div class="text-sm w-30">
                {% if device.connected %}
                    <span class="text-green-500 hover:underline" id="disconnect" onclick="disconnectBluetoothDevice(this)">
                        connected
                    </span>
                {% else %}
                    <span class="text-red-500 hover:underline" id="connect" onclick="connectBluetoothDevice(this)">
                        not connected
                    </span>
                {% endif %}
                
            </div>

        </li>
    {% endfor %}
</ul>

<script>
    async function bluetoothDeviceAction(element, action) {
        const macAddress = element.closest("li").dataset.macAddress;
        const response = await fetch(
            `/api/devices/bluetooth/${encodeURIComponent(macAddress)}/${action}`,
            { method: "PUT" },
        );

        if (!response.ok) {
            throw new Error(`Bluetooth ${action} failed: ${response.status}`);
        }

        window.location.reload();
    }

    function pairBluetoothDevice(element) {
        return bluetoothDeviceAction(element, "pair");
    }

    function unpairBluetoothDevice(element) {
        return bluetoothDeviceAction(element, "unpair");
    }

    function connectBluetoothDevice(element) {
        return bluetoothDeviceAction(element, "connect");
    }

    function disconnectBluetoothDevice(element) {
        return bluetoothDeviceAction(element, "disconnect");
    }
</script>
