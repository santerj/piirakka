<!DOCTYPE html>
<html lang="en">
    <head>
        <title>settings | piirakka</title>
        <script src="static/js/websocket.js"></script>
        {% include 'components/head.html' %}
    </head>
    <body class="h-screen overflow-hidden m-0 dark:text-neutral-300">
        <div class="grid grid-cols-12 h-screen">
            <!-- Sidebar: full height -->
            <aside class="col-span-2 border-r py-3 overflow-auto h-screen bg-stone-50 border-gray-300 dark:bg-neutral-800 dark:border-neutral-700">
                {% include 'components/sidebar.html' %}
            </aside>
            <!-- Main Content: height minus player bar -->
            <main id="Settings"
                  style="height: calc(100vh - 4rem)"
                  class="col-span-10 p-4 overflow-auto bg-white dark:bg-neutral-900">

                <h1 class="sticky top-0 text-3xl pt-3 pb-6 pl-3 font-nunito font-semibold bg-inherit">Settings</h1>
                <div class="sticky -mt-2 top-12 divider bg-inherit"></div>

                <h2 class="text-lg font-semibold py-3 pl-3">Bluetooth</h2>
                {% include 'components/bluetooth_devices.html' %}

                <h2 class="text-lg font-semibold py-3 pl-3">Search in streaming services</h2>
                {% include 'components/search-settings.html' %}

            </main>
        </div>
        <!-- Player Bar: fixed bottom right, does NOT cover sidebar -->
        <nav id="ControlBar"
             class="border-t shadow-lg fixed bottom-0 left-[16.66%] w-[83.33%] h-16 bg-gray-50 border-gray-300 dark:bg-[#2b2b2b] dark:border-neutral-700">
            {% include 'components/player.html' %}
        </nav>
    </body>
</html>
